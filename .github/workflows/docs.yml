name: Documentation

# Builds the DocC documentation and publishes it to GitHub Pages.
# Runs when main changes, and can be started manually from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build documentation
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Build DocC archive
        run: |
          xcodebuild docbuild \
            -scheme Pickel \
            -destination 'generic/platform=iOS' \
            -derivedDataPath .build/docbuild \
            -quiet

      - name: Convert to a static website
        run: |
          ARCHIVE=$(find .build/docbuild -type d -name 'Pickel.doccarchive' | head -1)
          xcrun docc process-archive transform-for-static-hosting "$ARCHIVE" \
            --output-path site \
            --hosting-base-path Pickel
          # Send visitors from the site root straight to the docs.
          echo '<!DOCTYPE html><meta charset="utf-8"><title>Pickel Documentation</title><meta http-equiv="refresh" content="0; url=documentation/pickel/"><a href="documentation/pickel/">Pickel documentation</a>' > site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
