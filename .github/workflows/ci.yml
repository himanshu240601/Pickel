name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS (swift test)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Swift version
        run: swift --version
      - name: Test
        run: |
          set -o pipefail
          swift test 2>&1 | tee test.log || {
            grep -E "error:|failed|Fatal|crash" test.log | head -20 | while read -r line; do
              echo "::error::$line"
            done
            exit 1
          }

  ios:
    name: iOS Simulator
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Pick simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          ios = [d for runtime, ds in devices.items() if "iOS" in runtime for d in ds if d["name"].startswith("iPhone")]
          print(ios[-1]["udid"])
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme Pickel \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            2>&1 | tee test.log | grep -E "error:|failed|passed|Executed|TEST" || {
            grep -E "error:|failed" test.log | head -20 | while read -r line; do
              echo "::error::$line"
            done
            exit 1
          }
